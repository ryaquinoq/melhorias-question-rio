<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Interativo - Patologia das Neoplasias</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap');

        :root {
            --cor-primaria: #f0f0f0;
            --cor-secundaria: #ccc;
            --cor-texto: #333;
            --branco: #fff;
            --azul-escuro: #003366;
            --azul-claro: #6699cc;
            --azul-vibrante: #007bff;
            --verde-certo: #4CAF50;
            --vermelho-errado: #f44336;
            --cinza-claro: #f9f9f9;
            --sombra: rgba(0, 0, 0, 0.1);
            --verde-justificativa-fundo: rgba(76, 175, 80, 0.1);
            --vermelho-justificativa-fundo: rgba(244, 67, 54, 0.1);
        }

        .animated-gradient-background {
            background: linear-gradient(-45deg, var(--azul-claro), var(--azul-escuro), #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            opacity: 0.08;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        body {
            font-family: 'Montserrat', sans-serif;
            margin: 0;
            padding: 0;
            color: var(--cor-texto);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            position: relative;
            z-index: 1;
        }

        .site-content {
            flex: 1;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            padding-bottom: 90px; /* Aumentado para acomodar a barra de navegação inferior com mais botões */
        }

        header {
            background-image: linear-gradient(to bottom, var(--azul-claro), var(--azul-escuro));
            color: var(--branco);
            padding: 1.5em 20px;
            text-align: center;
            width: 100%;
            max-width: 800px;
            margin-bottom: 30px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 6px var(--sombra);
        }

        .header-icon {
            width: 32px;
            height: 32px;
            margin-right: 15px;
            stroke: var(--branco);
        }

        header h1 {
            margin: 0;
            font-size: 1.5em; /* Ajustado para título potencialmente longo */
        }

        main {
            background-color: var(--branco);
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 15px var(--sombra);
            width: 100%;
            max-width: 700px; /* Aumentado um pouco para perguntas mais longas */
        }

        #quiz-container {
            margin-bottom: 25px;
        }

        .pergunta {
            font-size: 1.0em; /* Ajustado para perguntas potencialmente longas */
            margin-bottom: 15px;
            line-height: 1.45;
        }

        .opcoes {
            margin-bottom: 20px;
        }

        .opcoes button {
            display: block;
            width: 100%;
            padding: 10px; /* Levemente reduzido para mais texto */
            margin-bottom: 8px; /* Levemente reduzido */
            background-image: linear-gradient(to right, var(--azul-claro), var(--azul-escuro));
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.8em; /* Ajustado para opções potencialmente longas */
            font-family: 'Montserrat', sans-serif;
            transition: background-image 0.3s ease, background-color 0.3s ease, transform 0.2s ease-in-out;
            text-align: left;
            line-height: 1.3;
        }

        .opcoes button:hover:not(:disabled),
        .question-actions button:hover:not(:disabled),
        .navigation-buttons button:hover:not(:disabled) {
            background-image: none;
            background-color: var(--azul-vibrante);
            color: var(--branco);
            transform: scale(1.02);
        }

        button:disabled {
            cursor: not-allowed;
            opacity: 0.7;
        }

        #feedback {
            margin-top: 15px; /* Ajustado */
            margin-bottom: 10px; /* Ajustado */
            font-weight: bold;
            font-size: 1.0em;
        }

        .correto {
            color: var(--verde-certo);
        }

        .errado {
            color: var(--vermelho-errado);
        }

        .question-actions, .navigation-buttons {
            display: flex;
            justify-content: space-between;
            margin-top: 20px; /* Ajustado */
            gap: 10px;
        }

        .question-actions button, .navigation-buttons button {
            padding: 10px 15px;
            background-image: linear-gradient(to right, var(--azul-claro), var(--azul-escuro));
            color: var(--branco);
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.9em; /* Ajustado */
            font-family: 'Montserrat', sans-serif;
            transition: background-image 0.3s ease, background-color 0.3s ease, transform 0.2s ease-in-out;
            flex-grow: 1;
        }

        #pontuacao-final .card button {
            padding: 12px 20px;
            background-image: linear-gradient(to right, var(--azul-claro), var(--azul-escuro));
            color: var(--branco);
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1em;
            font-family: 'Montserrat', sans-serif;
            transition: background-image 0.3s ease, background-color 0.3s ease, transform 0.2s ease-in-out;
            margin-top: 20px;
        }

        #pontuacao-final .card button:hover:not(:disabled) {
            background-image: none;
            background-color: var(--azul-vibrante);
            color: var(--branco);
            transform: scale(1.05);
        }


        .navigation-buttons button.secondary-action {
            background-image: none;
            background-color: var(--cinza-claro);
            color: var(--azul-escuro);
            border: 1px solid var(--cor-secundaria);
        }
        .navigation-buttons button.secondary-action:hover:not(:disabled) {
            background-color: var(--cor-secundaria);
            color: var(--azul-escuro);
            transform: scale(1.05);
        }


        #pontuacao-final {
            text-align: center;
            margin-top: 20px;
        }

        .card {
            background-color: var(--branco);
            padding: 20px; /* Ajustado */
            border-radius: 8px;
            margin-bottom: 25px; /* Ajustado */
            box-shadow: 0 2px 8px var(--sombra);
            animation: fadeInSlideUp 0.5s ease-out forwards;
        }

        @keyframes fadeInSlideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .accordion {
            background-color: var(--azul-claro);
            color: var(--branco);
            cursor: pointer;
            padding: 10px; /* Ajustado */
            width: 100%;
            border: none;
            text-align: left;
            outline: none;
            font-size: 0.95em; /* Ajustado */
            font-family: 'Montserrat', sans-serif;
            border-radius: 5px;
            margin-top: 10px; /* Ajustado */
            transition: background-color 0.3s ease, transform 0.2s ease-in-out;
        }

        .accordion:hover {
            background-color: var(--azul-vibrante);
            transform: scale(1.02);
        }
        .accordion.active + .panel {
             border-top: 1px solid var(--cor-secundaria);
        }


        .panel {
            padding: 0px 0px;
            background-color: var(--branco);
            max-height: 0;
            overflow-y: auto;
            transition: max-height 0.4s ease-in-out;
            border-bottom-left-radius: 5px;
            border-bottom-right-radius: 5px;
            border-left: 1px solid var(--cor-secundaria);
            border-right: 1px solid var(--cor-secundaria);
            border-bottom: 1px solid var(--cor-secundaria);
        }


        .justificativa-item {
            padding: 8px 12px; /* Ajustado */
            margin: 6px 15px; /* Ajustado */
            border-radius: 4px;
            line-height: 1.4;
            font-size: 0.75em; /* Diminuído para caber mais texto de justificativa */
        }

        .justificativa-item strong {
            margin-right: 6px; /* Ajustado */
            font-weight: bold;
        }

        .justificativa-item.certa {
            background-color: var(--verde-justificativa-fundo);
            border-left: 4px solid var(--verde-certo); /* Ajustado */
            color: #2e7d32;
        }
        .justificativa-item.certa strong{
            color: var(--verde-certo);
        }

        .justificativa-item.errada {
            background-color: var(--vermelho-justificativa-fundo);
            border-left: 4px solid var(--vermelho-errado); /* Ajustado */
            color: #c62828;
        }
        .justificativa-item.errada strong{
            color: var(--vermelho-errado);
        }

        .panel > p:not(.justificativa-item) {
            margin: 12px 15px; /* Ajustado */
        }

        footer {
            width: 100%;
            padding: 15px; /* Ajustado */
            text-align: center;
            color: var(--azul-escuro);
            background-color: rgba(255, 255, 255, 0.7);
            box-shadow: 0 -2px 5px var(--sombra);
            margin-top: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
        }

        .footer-icon {
            width: 22px; /* Ajustado */
            height: 22px; /* Ajustado */
            margin-right: 8px; /* Ajustado */
            stroke: var(--azul-escuro);
        }

        #limpar-progresso-btn {
            margin-left: 8px;
            margin-top: 5px;
            padding: 7px 10px; /* Ajustado */
            border: 1px solid var(--azul-escuro);
            background-color: var(--branco);
            color: var(--azul-escuro);
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.85em; /* Ajustado */
        }
        #limpar-progresso-btn:hover {
            background-color: var(--cor-secundaria);
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: var(--azul-escuro);
            padding: 8px 4px; /* Ajustado para acomodar mais botões */
            box-shadow: 0 -2px 8px rgba(0,0,0,0.2);
            display: flex;
            justify-content: flex-start; /* Alinha à esquerda para permitir scroll */
            align-items: center;
            gap: 4px; /* Diminuído o gap para mais botões */
            overflow-x: auto;
            z-index: 1000;
            -webkit-overflow-scrolling: touch;
        }

        .bottom-nav button {
            background-color: var(--azul-claro);
            color: var(--branco);
            border: 1px solid var(--azul-escuro);
            border-radius: 50%;
            width: 32px; /* Diminuído para caber mais botões (40) */
            height: 32px; /* Diminuído */
            font-size: 0.75em; /* Diminuído */
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.2s ease, transform 0.15s ease, border-color 0.2s ease;
            flex-shrink: 0;
        }

        .bottom-nav button:hover {
            background-color: var(--azul-vibrante);
            transform: translateY(-2px);
        }

        .bottom-nav button.atual {
            background-color: var(--azul-vibrante);
            transform: scale(1.15);
            border: 2px solid var(--branco);
            box-shadow: 0 0 5px rgba(255,255,255,0.5);
        }

        .bottom-nav button.certo {
            background-color: var(--verde-certo);
            border-color: var(--verde-certo);
            color: var(--branco);
        }
        .bottom-nav button.certo:hover {
             background-color: #3e8e41;
        }


        .bottom-nav button.errado {
            background-color: var(--vermelho-errado);
            border-color: var(--vermelho-errado);
            color: var(--branco);
        }
        .bottom-nav button.errado:hover {
            background-color: #c4302b;
        }

    </style>
</head>
<body>
    <div class="animated-gradient-background"></div>
    <div class="site-content">
        <header>
            <svg class="header-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M4.26 10.147a60.436 60.436 0 00-.491 6.347A48.627 48.627 0 0112 20.904a48.627 48.627 0 018.232-4.41 60.46 60.46 0 00-.491-6.347m-15.482 0a50.57 50.57 0 00-2.658-.813A59.905 59.905 0 0112 3.493a59.902 59.902 0 0110.399 5.84c-.896.248-1.783.52-2.658.814m-15.482 0A50.697 50.697 0 0112 13.489a50.702 50.702 0 017.74-3.342M6.75 15a.75.75 0 100-1.5.75.75 0 000 1.5zm0 0v-3.675A55.378 55.378 0 0112 8.443m-7.007 11.55A5.981 5.981 0 006.75 15.75v-1.5" />
            </svg>
            <h1>Quiz: Patologia das Neoplasias</h1>
        </header>
        <main>
            <div id="quiz-container">
                <div class="card">
                    <p class="pergunta"></p>
                    <div class="opcoes">
                    </div>
                    <div class="question-actions">
                         <button id="pular-questao">Pular Questão</button>
                    </div>
                    <p id="feedback"></p>
                    <button class="accordion">Ver Justificativa</button>
                    <div class="panel">
                    </div>
                </div>
            </div>
            <div id="pontuacao-final" style="display: none;">
                <div class="card">
                    <h2>Pontuação Final: <span id="pontos">0</span></h2>
                </div>
            </div>
            <div class="navigation-buttons" style="display: none;">
                <button id="anterior-questao" class="secondary-action">Anterior</button>
                <button id="proxima-questao">Próxima</button>
                <button id="reiniciar-quiz">Reiniciar Quiz</button>
            </div>
        </main>
    </div>
    <footer>
        <svg class="footer-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z" />
        </svg>
        <span>Encontre mais quizzes e aprenda!</span>
        <button id="limpar-progresso-btn">Limpar Progresso</button>
    </footer>
    <div class="bottom-nav">
    </div>

    <script>
        const containerQuiz = document.getElementById('quiz-container');
        const elementoPergunta = document.querySelector('.pergunta');
        const containerOpcoes = document.querySelector('.opcoes');
        const elementoFeedback = document.getElementById('feedback');
        const btnPularQuestao = document.getElementById('pular-questao');

        const btnAccordion = document.querySelector('.accordion');
        const painelAccordion = document.querySelector('.panel');

        const containerPontuacaoFinal = document.getElementById('pontuacao-final');
        const elementoPontos = document.getElementById('pontos');

        const containerNavegacao = document.querySelector('.navigation-buttons');
        const btnAnterior = document.getElementById('anterior-questao');
        const btnProxima = document.getElementById('proxima-questao');
        const btnReiniciar = document.getElementById('reiniciar-quiz');
        const btnLimparProgresso = document.getElementById('limpar-progresso-btn');

        const CHAVE_PROCESSO = 'quizProgressoNeoplasiasV1';

        const questoes = [
            { // Questão 1
                pergunta: "Um paciente masculino de 65 anos apresenta uma massa bem delimitada no tecido subcutâneo do braço, de crescimento lento e móvel à palpação. A biópsia excisional revela uma neoplasia composta por adipócitos maduros virtualmente indistinguíveis de adipócitos normais, sem pleomorfismo significativo, mitoses raras e sem evidência de invasão tecidual circundante. Esta descrição patológica, conforme os princípios de nomenclatura e características morfológicas das neoplasias, melhor se alinha com qual diagnóstico?",
                opcoes: [
                    "Adenoma de tecido adiposo, um tumor benigno com potencial de malignização.",
                    "Lipossarcoma, indicando uma neoplasia maligna de origem mesenquimal.",
                    "Hamartoma adiposo, caracterizado por um crescimento desordenado de tecido nativo.",
                    "Lipoma, representando uma neoplasia benigna de tecido adiposo."
                ],
                correta: 3,
                justificativas: [
                    "Incorreta. Adenoma refere-se a neoplasias epiteliais benignas. Lipomas raramente malignizam, e a descrição não sugere tal potencial.",
                    "Incorreta. Lipossarcoma é maligno, com invasão e atipia, características ausentes na descrição.",
                    "Incorreta. Hamartoma é uma malformação de tecidos nativos, não uma neoplasia com crescimento autônomo como descrito.",
                    "Correta. A descrição (bem delimitada, crescimento lento, adipócitos maduros sem atipia ou invasão) é clássica de lipoma, uma neoplasia benigna de tecido adiposo."
                ]
            },
            { // Questão 2
                pergunta: "Ao classificar uma neoplasia epitelial maligna que exibe um padrão de crescimento glandular, qual termo nomenclatural é classicamente aplicado, conforme as fontes?",
                opcoes: [
                    "Carcinoma Epidermóide",
                    "Sarcoma",
                    "Adenoma",
                    "Adenocarcinoma"
                ],
                correta: 3,
                justificativas: [
                    "Incorreta. Carcinoma Epidermóide (ou Espinocelular) apresenta diferenciação escamosa, não glandular.",
                    "Incorreta. Sarcoma designa neoplasias malignas de tecidos mesenquimais, não epiteliais.",
                    "Incorreta. Adenoma é uma neoplasia epitelial benigna que forma glândulas, não maligna.",
                    "Correta. Neoplasias malignas de origem epitelial são Carcinomas. Aquelas com padrão glandular são Adenocarcinomas."
                ]
            },
            { // Questão 3
                pergunta: "Um patologista examina uma lâmina de biópsia de um tumor e nota a presença de células com marcada variação no tamanho e forma, núcleos desproporcionalmente grandes e hipercromáticos, e figuras mitóticas bizarras. Conforme os critérios morfológicos para distinguir neoplasias, estas características são indicativas de:",
                opcoes: [
                    "Metaplasia",
                    "Diferenciação Celular",
                    "Anaplasia",
                    "Hamartoma"
                ],
                correta: 2,
                justificativas: [
                    "Incorreta. Metaplasia é a substituição reversível de um tipo celular adulto por outro, com células maduras.",
                    "Incorreta. Diferenciação refere-se à semelhança com células de origem; a descrição aponta para perda de diferenciação.",
                    "Correta. Variação acentuada no tamanho e forma celular/nuclear (pleomorfismo), núcleos grandes/hipercromáticos e mitoses bizarras são manifestações de Anaplasia, um marcador de malignidade.",
                    "Incorreta. Hamartoma é uma malformação de tecidos nativos maduros, sem as atipias descritas."
                ]
            },
            { // Questão 4
                pergunta: "Um radiologista identifica uma massa com bordas irregulares e que parece invadir o tecido circundante em um exame de imagem. O cirurgião confirma a dificuldade em delimitar a lesão durante a ressecção. Microscopicamente, o patologista observa ninhos celulares infiltrando o estroma adjacente. Conforme as características comparativas entre neoplasias benignas e malignas, este padrão de crescimento é típico de:",
                opcoes: [
                    "Tumores Benignos, que crescem de forma coesa e expansiva.",
                    "Tumores Malignos, caracterizados por infiltração progressiva e destruição tecidual.",
                    "Hamartomas, que se misturam desordenadamente com o tecido nativo.",
                    "Tumores Benignos encapsulados, que delimitam-se nitidamente."
                ],
                correta: 1,
                justificativas: [
                    "Incorreta. Tumores benignos crescem de forma coesa e expansiva, sem invadir.",
                    "Correta. Neoplasias malignas caracterizam-se por infiltração progressiva, invasão e destruição dos tecidos circundantes, com margens irregulares.",
                    "Incorreta. Hamartomas são malformações, não neoplasias com crescimento invasivo ativo.",
                    "Incorreta. Tumores benignos são frequentemente encapsulados ou bem delimitados, o oposto do descrito."
                ]
            },
            { // Questão 5
                pergunta: "Qual das seguintes vias de disseminação metastática é considerada a mais comum para a disseminação inicial da maioria dos CARCINOMAS?",
                opcoes: [
                    "Disseminação Hematogênica",
                    "Implante em Cavidades Corporais (Transcelômica)",
                    "Disseminação por Continuidade",
                    "Disseminação Linfática"
                ],
                correta: 3,
                justificativas: [
                    "Incorreta. Disseminação hematogênica é preferencial para sarcomas, embora carcinomas avançados também a utilizem.",
                    "Incorreta. Implante transcelômico é característico de certos tumores (ex: ovário), não a via mais comum para a maioria dos carcinomas.",
                    "Incorreta. Disseminação por continuidade (invasão local) é um pré-requisito, não uma via de metástase a distância.",
                    "Correta. As fontes afirmam que a Disseminação Linfática é a via mais comum para a disseminação inicial da maioria dos carcinomas."
                ]
            },
            { // Questão 6
                pergunta: "Um médico encontra múltiplos pólipos adenomatosos no cólon de um paciente jovem durante uma colonoscopia. A remoção endoscópica desses pólipos é recomendada. Com base nas informações sobre condições predisponentes e lesões precursoras, qual a justificativa principal para essa conduta?",
                opcoes: [
                    "Os pólipos adenomatosos representam metástases de um câncer primário desconhecido e devem ser removidos para estadiamento.",
                    "Os pólipos adenomatosos são malformações congênitas (coristomas) que causam sintomas obstrutivos e não regridem espontaneamente.",
                    "Os pólipos adenomatosos são lesões precursoras bem definidas do adenocarcinoma colorretal e sua remoção previne o câncer invasivo.",
                    "Os pólipos adenomatosos são neoplasias benignas sem potencial de malignização, mas sua remoção é necessária para confirmar o diagnóstico histológico."
                ],
                correta: 2,
                justificativas: [
                    "Incorreta. Pólipos adenomatosos são neoplasias primárias benignas (precursoras), não metástases.",
                    "Incorreta. Pólipos adenomatosos são neoplasias (adenomas), não coristomas. A principal razão para remoção é prevenção do câncer.",
                    "Correta. Adenomas colônicos são lesões precursoras do adenocarcinoma colorretal. Sua remoção previne o câncer invasivo.",
                    "Incorreta. Adenomas colônicos, especialmente os maiores ou com displasia de alto grau, têm risco significativo de malignização."
                ]
            },
            { // Questão 7
                pergunta: "A epidemiologia do câncer revela variações geográficas significativas na incidência de certos tipos de neoplasias. Um exemplo notável mencionado nos materiais é a alta incidência de carcinoma hepatocelular (CHC) em regiões como o sudeste da China e a África subsaariana. Qual fator de risco, frequentemente prevalente nessas regiões, é mais fortemente associado à causalidade do CHC, conforme as fontes?",
                opcoes: [
                    "Exposição a Radiação Ultravioleta",
                    "Tabagismo Crônico",
                    "Infecção Crônica pelos Vírus da Hepatite B (HBV) e C (HCV)",
                    "Consumo Elevado de Carnes Processadas"
                ],
                correta: 2,

        let indiceAtual;
        let statusQuestoes;
        let respostasUsuario;

        function inicializarVariaveisQuiz() {
            indiceAtual = 0;
            statusQuestoes = Array(questoes.length).fill(null);
            respostasUsuario = Array(questoes.length).fill(null);
        }

        function salvarProgresso() {
            const progresso = {
                indiceAtual,
                statusQuestoes,
                respostasUsuario
            };
            localStorage.setItem(CHAVE_PROCESSO, JSON.stringify(progresso));
        }

        function carregarProgresso() {
            const progressoSalvo = localStorage.getItem(CHAVE_PROCESSO);
            if (progressoSalvo) {
                try {
                    const dados = JSON.parse(progressoSalvo);
                    if (dados && typeof dados.indiceAtual === 'number' &&
                        Array.isArray(dados.statusQuestoes) && dados.statusQuestoes.length === questoes.length &&
                        Array.isArray(dados.respostasUsuario) && dados.respostasUsuario.length === questoes.length) {

                        indiceAtual = dados.indiceAtual;
                        statusQuestoes = dados.statusQuestoes;
                        respostasUsuario = dados.respostasUsuario;

                         if (statusQuestoes.every(s => s !== null) && indiceAtual >= questoes.length -1 ) {
                            if (statusQuestoes[questoes.length -1] !== null || indiceAtual >= questoes.length) {
                                mostrarTelaDesempenho();
                                return true;
                            }
                        }
                        return false;
                    } else {
                        console.warn('Progresso salvo é de uma versão diferente do quiz ou está corrompido. Resetando.');
                        localStorage.removeItem(CHAVE_PROCESSO);
                        inicializarVariaveisQuiz();
                    }
                } catch (error) {
                    console.error('Erro ao parsear progresso salvo:', error);
                    localStorage.removeItem(CHAVE_PROCESSO);
                    inicializarVariaveisQuiz();
                }
            } else {
                inicializarVariaveisQuiz();
            }
            return false;
        }

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function renderizarQuestao(indice) {
            if (indice < 0 || indice >= questoes.length) return;

            const questaoAtual = questoes[indice];
            const card = containerQuiz.querySelector('.card');

            card.style.animation = 'none';
            void card.offsetWidth;
            card.style.animation = 'fadeInSlideUp 0.5s ease-out forwards';

            elementoPergunta.textContent = `(${indice + 1}/${questoes.length}) ${questaoAtual.pergunta}`;
            containerOpcoes.innerHTML = '';
            elementoFeedback.textContent = '';
            elementoFeedback.className = '';

            let containerJustificativas = painelAccordion.querySelector('.justificativa-content');
            if (!containerJustificativas) {
                painelAccordion.innerHTML = '';
                containerJustificativas = document.createElement('div');
                containerJustificativas.className = 'justificativa-content';
                painelAccordion.appendChild(containerJustificativas);
            }
            containerJustificativas.innerHTML = '';

            painelAccordion.style.maxHeight = null;
            btnAccordion.classList.remove('active');
            btnAccordion.style.display = 'none';

            const respondida = statusQuestoes[indice] !== null;
            let effectiveOriginalCorrectIndex; // This will hold the true original correct index for styling.

            if (!respondida || !questaoAtual.opcoesEmbaralhadas) {
                // First time rendering this question OR if it was skipped and came back before answering.
                effectiveOriginalCorrectIndex = questaoAtual.correta; // Capture true original correct index
                questaoAtual.trueOriginalIndex = effectiveOriginalCorrectIndex; // Store it persistently on the question object

                let opcoesComJustificativas = questaoAtual.opcoes.map((opcao, idx) => ({
                    opcaoTexto: opcao,
                    justificativaTexto: questaoAtual.justificativas[idx],
                    originalIndex: idx
                }));
                shuffleArray(opcoesComJustificativas);
                questaoAtual.opcoesEmbaralhadas = opcoesComJustificativas;
                // Update questaoAtual.correta to the new index of the correct option in the SHUFFLED array
                questaoAtual.correta = questaoAtual.opcoesEmbaralhadas.findIndex(opt => opt.originalIndex === effectiveOriginalCorrectIndex);
            } else {
                // Question has been answered or previously processed and shuffled.
                // Retrieve the stored true original correct index.
                effectiveOriginalCorrectIndex = questaoAtual.trueOriginalIndex;
            }

            const opcoesParaRenderizar = questaoAtual.opcoesEmbaralhadas;
            // questaoAtual.correta now holds the SHUFFLED index of the correct answer.

            opcoesParaRenderizar.forEach((item, i) => {
                const botao = document.createElement('button');
                botao.textContent = String.fromCharCode(65 + i) + ") " + item.opcaoTexto;
                botao.disabled = respondida;
                botao.addEventListener('click', () => validarResposta(i));

                if (respondida) {
                    if (i === respostasUsuario[indice]) {
                        botao.style.backgroundImage = 'none';
                        botao.style.backgroundColor = statusQuestoes[indice] ? 'var(--verde-certo)' : 'var(--vermelho-errado)';
                        botao.style.color = 'var(--branco)';
                        botao.style.fontWeight = 'bold';
                    }
                    // Highlight the ACTUAL correct answer if the user was wrong.
                    // Compare item's originalIndex with the consistently stored true original correct index.
                    if (item.originalIndex === effectiveOriginalCorrectIndex && !statusQuestoes[indice] && i !== respostasUsuario[indice]) {
                        botao.style.backgroundImage = 'none';
                        botao.style.backgroundColor = 'var(--verde-certo)';
                        botao.style.color = 'var(--branco)';
                        botao.style.opacity = '0.85';
                    }
                }
                containerOpcoes.appendChild(botao);
            });

            if (respondida) {
                btnAccordion.style.display = 'block';
                elementoFeedback.textContent = statusQuestoes[indice] ? "Correto!" : "Errado!";
                elementoFeedback.classList.add(statusQuestoes[indice] ? "correto" : "errado");

                const containerJustificativasInterno = painelAccordion.querySelector('.justificativa-content');
                containerJustificativasInterno.innerHTML = ''; // Clear before adding new ones

                opcoesParaRenderizar.forEach((item, i) => {
                    const letraOpcao = String.fromCharCode(65 + i);

                    const pJustificativa = document.createElement('p');
                    pJustificativa.classList.add('justificativa-item');
                    pJustificativa.innerHTML = `<strong>${letraOpcao})</strong> ${item.justificativaTexto}`;

                    // Compare item's originalIndex with the consistently stored true original correct index.
                    if (item.originalIndex === effectiveOriginalCorrectIndex) {
                        pJustificativa.classList.add('certa');
                    } else {
                        pJustificativa.classList.add('errada');
                    }
                    containerJustificativasInterno.appendChild(pJustificativa);
                });
            }

            btnPularQuestao.style.display = respondida ? 'none' : 'block';
            btnPularQuestao.disabled = respondida;
        }

        function validarResposta(indiceOpcaoSelecionada) {
            // indiceOpcaoSelecionada é o índice da opção no array embaralhado (opcoesEmbaralhadas)
            if (statusQuestoes[indiceAtual] !== null) return;

            const questaoAtual = questoes[indiceAtual];
            respostasUsuario[indiceAtual] = indiceOpcaoSelecionada;

            // questaoAtual.correta já foi atualizado em renderizarQuestao para ser o índice correto no array embaralhado
            const acertou = indiceOpcaoSelecionada === questaoAtual.correta;
            statusQuestoes[indiceAtual] = acertou;

            renderizarQuestao(indiceAtual); // Re-renderiza para mostrar feedback e justificativas
            renderizarNavInferior();
            renderizarBarraNavegacaoQuestoes();
            salvarProgresso();

            if (statusQuestoes.every(s => s !== null)) {
                setTimeout(mostrarTelaDesempenho, 1500);
            }
        }

        function pularQuestao() {
            if (statusQuestoes[indiceAtual] === null) {
            }

            if (indiceAtual < questoes.length - 1) {
                indiceAtual++;
                renderizarQuestao(indiceAtual);
                renderizarNavInferior();
                renderizarBarraNavegacaoQuestoes();
                salvarProgresso();
            } else {
                mostrarTelaDesempenho();
            }
        }

        function mostrarTelaDesempenho() {
            containerQuiz.style.display = 'none';
            containerNavegacao.style.display = 'none';
            btnPularQuestao.style.display = 'none';

            const acertos = statusQuestoes.filter(s => s === true).length;
            elementoPontos.textContent = `${acertos} de ${questoes.length}`;
            containerPontuacaoFinal.style.display = 'block';

            const cardPontuacao = containerPontuacaoFinal.querySelector('.card');
            cardPontuacao.style.animation = 'none';
            void cardPontuacao.offsetWidth;
            cardPontuacao.style.animation = 'fadeInSlideUp 0.5s ease-out forwards';

            const oldBtn = cardPontuacao.querySelector('button');
            if(oldBtn) oldBtn.remove();

            const btnReiniciarQuizDesempenho = document.createElement('button');
            btnReiniciarQuizDesempenho.textContent = "Reiniciar Quiz";
            btnReiniciarQuizDesempenho.addEventListener('click', limparProgressoEresetarQuiz);
            cardPontuacao.appendChild(btnReiniciarQuizDesempenho);

            renderizarBarraNavegacaoQuestoes();
        }


        function renderizarNavInferior() {
            containerNavegacao.style.display = 'flex';
            btnAnterior.disabled = indiceAtual === 0;

            const todasRespondidas = statusQuestoes.every(s => s !== null);

            if (todasRespondidas) {
                btnProxima.textContent = "Ver Desempenho";
                btnProxima.disabled = false;
            } else {
                btnProxima.textContent = "Próxima";
                if (statusQuestoes[indiceAtual] !== null) {
                    btnProxima.disabled = indiceAtual === questoes.length - 1;
                } else {
                    btnProxima.disabled = false;
                    if (indiceAtual === questoes.length -1) {
                        btnProxima.disabled = true;
                    }
                }
            }
            if (indiceAtual === questoes.length - 1 && statusQuestoes[indiceAtual] !== null) {
                btnProxima.textContent = "Ver Desempenho";
                btnProxima.disabled = false;
            }
        }


        function navegarProxima() {
            const todasRespondidas = statusQuestoes.every(s => s !== null);
            if (todasRespondidas || (indiceAtual === questoes.length - 1 && statusQuestoes[indiceAtual] !== null)) {
                mostrarTelaDesempenho();
            } else if (indiceAtual < questoes.length - 1) {
                indiceAtual++;
                renderizarQuestao(indiceAtual);
                renderizarNavInferior();
                renderizarBarraNavegacaoQuestoes();
                salvarProgresso();
            }
        }

        function navegarAnterior() {
            if (indiceAtual > 0) {
                indiceAtual--;
                renderizarQuestao(indiceAtual);
                renderizarNavInferior();
                renderizarBarraNavegacaoQuestoes();
                salvarProgresso();
            }
        }

        function renderizarBarraNavegacaoQuestoes() {
            const navContainer = document.querySelector('.bottom-nav');
            navContainer.innerHTML = '';

            questoes.forEach((_, i) => {
                const btnQuestao = document.createElement('button');
                btnQuestao.textContent = `${i + 1}`;
                btnQuestao.title = `Ir para Questão ${i + 1}`;

                if (i === indiceAtual && containerQuiz.style.display !== 'none') {
                    btnQuestao.classList.add('atual');
                }
                if (statusQuestoes[i] === true) {
                    btnQuestao.classList.add('certo');
                } else if (statusQuestoes[i] === false) {
                    btnQuestao.classList.add('errado');
                }

                btnQuestao.addEventListener('click', () => {
                    if (containerPontuacaoFinal.style.display === 'block') {
                        containerPontuacaoFinal.style.display = 'none';
                        containerQuiz.style.display = 'block';
                        containerNavegacao.style.display = 'flex';
                    }
                    indiceAtual = i;
                    renderizarQuestao(indiceAtual);
                    renderizarNavInferior();
                    renderizarBarraNavegacaoQuestoes();
                    salvarProgresso();
                });
                navContainer.appendChild(btnQuestao);
            });
        }


        // Event Listeners
        document.addEventListener('DOMContentLoaded', () => {
            const desempenhoMostradoAoCarregar = carregarProgresso();
            if (!desempenhoMostradoAoCarregar) {
                renderizarQuestao(indiceAtual);
                renderizarNavInferior();
            }
            renderizarBarraNavegacaoQuestoes();
        });

        btnAnterior.addEventListener('click', navegarAnterior);
        btnProxima.addEventListener('click', navegarProxima);
        btnReiniciar.addEventListener('click', limparProgressoEresetarQuiz);
        btnPularQuestao.addEventListener('click', pularQuestao);
        btnLimparProgresso.addEventListener('click', limparProgressoEresetarQuiz);

        btnAccordion.addEventListener('click', () => {
            btnAccordion.classList.toggle('active');
            if (painelAccordion.style.maxHeight && painelAccordion.style.maxHeight !== "0px") {
                painelAccordion.style.maxHeight = null;
            } else {
                painelAccordion.style.maxHeight = (painelAccordion.scrollHeight + 20) + "px";
            }
        });

    </script>
</body>
</html>
